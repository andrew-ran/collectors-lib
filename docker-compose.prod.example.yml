# Illustrative production example -- see SELF_HOSTING.md. NOT a drop-in
# replacement for docker-compose.yml and not tested end-to-end against a
# real domain/certificate issuance (no way to verify that in this project's
# sandbox). Copy the pieces you need, adjust paths/domain, and test it
# yourself before relying on it for a real deployment.
#
# Differences from the dev docker-compose.yml this is based on:
# - app/queue/scheduler no longer bind-mount the source tree over the built
#   image -- that bind mount is what makes local edits show up live in dev;
#   in production you want whatever code was actually baked in at build time.
# - The dev `frontend` service (Vite's dev server) is replaced by a one-shot
#   `frontend-build` step (`npm run build`) whose `dist/` output nginx serves
#   as static files, instead of proxying every request to Vite.
# - `db`/`redis` no longer publish ports to the host at all.
# - A `caddy` service terminates HTTPS and proxies to `nginx` internally,
#   instead of `nginx` publishing a host port directly.
# - `restart: unless-stopped` added to every long-running service.
#
# DB_PASSWORD/DB_ROOT_PASSWORD below are read from a `.env` file in this same
# directory (Docker Compose's own variable substitution, separate from
# Laravel's src/backend/.env) -- create one here with those two values set,
# matching whatever you put in src/backend/.env's DB_PASSWORD.

services:
  app:
    build:
      context: ./src/backend
    restart: unless-stopped
    depends_on:
      - db
      - redis

  queue:
    build:
      context: ./src/backend
    command: php artisan queue:work --tries=3
    restart: unless-stopped
    depends_on:
      - db
      - redis

  scheduler:
    build:
      context: ./src/backend
    command: php artisan schedule:work
    restart: unless-stopped
    depends_on:
      - db
      - redis

  # Runs once and exits -- nginx just needs `frontend_dist` populated before
  # it starts. Re-run after any frontend change (`docker compose run --rm
  # frontend-build`), then restart nginx to pick up the new build.
  frontend-build:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./src/frontend:/app
      - frontend_dist:/app/dist
    command: sh -c "npm install && npm run build"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./src/backend:/var/www/html:ro
      - frontend_dist:/var/www/frontend-dist:ro
      - ./docker/nginx.prod.conf.example:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - frontend-build
    # No host port published -- only reachable from `caddy` on the compose
    # network.

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - nginx

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: collectors_lib
      MYSQL_USER: collectors_lib
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    # No `ports:` -- not reachable from the host directly, only from other
    # containers on the compose network (unlike the dev compose file, which
    # publishes 3307 for local debugging convenience).

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No `ports:` -- same reasoning as `db` above.

volumes:
  db_data:
  frontend_dist:
  caddy_data:
