# Illustrative production example -- see SELF_HOSTING.md. NOT a drop-in
# replacement for docker-compose.yml and not tested end-to-end against a
# real domain/certificate issuance (no way to verify that in this project's
# sandbox). Copy the pieces you need, adjust paths/domain/image names, and
# test it yourself before relying on it for a real deployment.
#
# Images are pulled from a registry (GHCR by default -- see
# .github/workflows/deploy.yml) rather than built locally with `build:`.
# CI builds `app` and `web` on GitHub's runners and pushes them; this
# compose file (and the VPS) only ever run `docker compose pull` + `up -d`,
# never `npm install`/`composer install`/`vite build`/etc. themselves -- the
# whole point on a small (2 vCPU / 1GB RAM) box, where running those build
# steps locally has caused real resource-exhaustion problems before.
# Replace `ghcr.io/YOUR_GITHUB_USERNAME` below with your own.
#
# Differences from the dev docker-compose.yml this is based on:
# - app/queue/scheduler run a pre-built image instead of bind-mounting the
#   source tree over a locally built one.
# - The dev `frontend` service (Vite's dev server) and the old one-shot
#   `frontend-build` step are both gone -- the React SPA is built by CI and
#   baked directly into the `web` image (see docker/web.Dockerfile),
#   alongside nginx and its production config.
# - `db`/`redis` no longer publish ports to the host at all.
# - A `caddy` service terminates HTTPS and proxies to `web` internally,
#   instead of nginx publishing a host port directly.
# - `restart: unless-stopped` added to every long-running service.
# - A `storage_public` named volume replaces the old bind-mount of the
#   backend source tree into nginx -- it's the only thing `app` and `web`
#   actually need to share (admin-uploaded covers/photos/avatars), mounted
#   directly at the path each side expects rather than relying on Laravel's
#   storage:link symlink (which only matters for `app`'s own filesystem).
#
# DB_PASSWORD/DB_ROOT_PASSWORD below are read from a `.env` file in this same
# directory (Docker Compose's own variable substitution, separate from
# Laravel's src/backend/.env, and gitignored at the repo root) -- create one
# here with those two values set, matching whatever you put in
# src/backend/.env's DB_PASSWORD.

services:
  app:
    image: ghcr.io/YOUR_GITHUB_USERNAME/collectors-lib-app:latest
    restart: unless-stopped
    volumes:
      - storage_public:/var/www/html/storage/app/public
    depends_on:
      - db
      - redis

  queue:
    image: ghcr.io/YOUR_GITHUB_USERNAME/collectors-lib-app:latest
    command: php artisan queue:work --tries=3
    restart: unless-stopped
    volumes:
      - storage_public:/var/www/html/storage/app/public
    depends_on:
      - db
      - redis

  scheduler:
    image: ghcr.io/YOUR_GITHUB_USERNAME/collectors-lib-app:latest
    command: php artisan schedule:work
    restart: unless-stopped
    volumes:
      - storage_public:/var/www/html/storage/app/public
    depends_on:
      - db
      - redis

  web:
    image: ghcr.io/YOUR_GITHUB_USERNAME/collectors-lib-web:latest
    restart: unless-stopped
    volumes:
      - storage_public:/var/www/storage-public:ro
    depends_on:
      - app
    # No host port published -- only reachable from `caddy` on the compose
    # network.

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: collectors_lib
      MYSQL_USER: collectors_lib
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    # No `ports:` -- not reachable from the host directly, only from other
    # containers on the compose network (unlike the dev compose file, which
    # publishes 3307 for local debugging convenience).

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No `ports:` -- same reasoning as `db` above.

volumes:
  db_data:
  storage_public:
  caddy_data:
