# Reverse proxy for local development:
# - everything except /api and /up goes to the Vite dev server (hot reload)
# - /api and /up are handled by Laravel through PHP-FPM
# See docs/ARCHITECTURE.md -- production self-hosting serves a static SPA
# build instead; this config is the Phase 0 dev setup.

server {
    listen 80;
    server_name collectors-lib.test localhost;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location ~ ^/(api|up) {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # NOTE: no dotfile-deny rule here on purpose. In this dev proxy setup,
    # only /api and /up ever hit the Laravel static root via try_files above --
    # everything else (including any dotfile path) goes to the Vite proxy, so
    # there's nothing on the Laravel side to accidentally expose. A regex like
    # `~ /\.(?!well-known)` would also (wrongly) block Vite's own /node_modules/.vite
    # dep-cache requests. Revisit this for the production config (Phase 3),
    # where nginx serves the built static SPA directly instead of proxying to Vite.
}
