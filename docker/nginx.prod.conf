# Production nginx config, baked into the `web` image by docker/web.Dockerfile
# at CI build time (see .github/workflows/deploy.yml) -- unlike Caddyfile and
# docker-compose.prod.yml, this file has to be committed for real (not just
# as a .example) since the GitHub Actions runner only sees what's actually in
# the repo, not anything created locally on the server. Nothing sensitive
# lives here (just the domain and internal routing), so that's safe.
#
# If you're forking this project to self-host your own copy and want to use
# the same CI/CD approach, edit server_name below to your own domain and
# commit that change in your fork -- see SELF_HOSTING.md.

server {
    listen 80;
    server_name collectors-lib.com www.collectors-lib.com;
    client_max_body_size 20m;

    # SCRIPT_FILENAME below is resolved by PHP-FPM on the `app` container's
    # own filesystem, not this one -- nginx doesn't need Laravel's source
    # tree locally for this to work, it just needs the path string to match
    # where `app`'s Dockerfile actually puts public/index.php.
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ ^/(api|up) {
        try_files $uri /index.php?$query_string;
    }

    # Admin-uploaded covers/photos/avatars. Unlike the routes above, this one
    # genuinely serves files from disk (no PHP fallback) -- backed by the
    # `storage_public` named volume, shared with `app`/`queue`/`scheduler`
    # (see docker-compose.prod.example.yml), mounted directly at this path
    # rather than relying on Laravel's storage:link symlink (which only
    # matters for the app container's own filesystem, not this one).
    location /storage/ {
        alias /var/www/storage-public/;
        try_files $uri =404;
    }

    # The built React SPA -- everything else.
    location / {
        root /var/www/frontend-dist;
        try_files $uri $uri/ /index.html;
    }
}
