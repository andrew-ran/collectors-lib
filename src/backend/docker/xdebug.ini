; Xdebug config for local development (Phase 0 dev image only).
; See Dockerfile for the PHPStorm setup steps.

[xdebug]
xdebug.mode=develop,debug
xdebug.start_with_request=yes
; Docker Desktop resolves this to the host machine automatically.
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.idekey=PHPSTORM
